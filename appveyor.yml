image:
  - Visual Studio 2026
  - Ubuntu2204
environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
install:
  - pwsh: |
      if ($isWindows) {
        Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -OutFile "./dotnet-install.ps1"
        ./dotnet-install.ps1 -Channel 11.0 -InstallDir 'C:\Program Files\dotnet'
      }
      else {
        Invoke-WebRequest "https://dot.net/v1/dotnet-install.sh" -OutFile "./dotnet-install.sh"
        sudo chmod u+x dotnet-install.sh
        if ($isMacOS) {
        } else {
          sudo ./dotnet-install.sh -Channel 10.0 --install-dir '/usr/share/dotnet'
          sudo ./dotnet-install.sh -Channel 11.0 --install-dir '/usr/share/dotnet'
        }
      }
build_script:
  - cd scripts
  - cmd: bash -c "./dotnet_build.sh"
  - sh: ./dotnet_build.sh no_net481
  - dotnet ../benchmarks/Fastenshtein.Benchmarking/bin/Release/net11.0/Fastenshtein.Benchmarking.dll --filter "*.FastenshteinBenchmark_*"

artifacts:
  - path: scripts/BenchmarkDotNet.Artifacts
    name: Benchmark results - $(APPVEYOR_BUILD_WORKER_IMAGE)