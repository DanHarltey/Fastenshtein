version: 2.1

functions:
  setup-dotnet: github.com/circleci-functions/setup-dotnet@v0.1.0

executors:
  linux-x64:
    docker:
      - image: cimg/base:current
    resource_class: medium
    environment:
      DOTNET_BUILD_ARGS: no_net481
  linux-arm:
    docker:
      - image: cimg/base:current
    resource_class: arm.medium
    environment:
      DOTNET_BUILD_ARGS: no_net481
  macos:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      DOTNET_BUILD_ARGS: no_net481
  windows:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: bash.exe -eo pipefail
    environment:
      # Empty means the script's default branch, which also runs the net481 tests.
      DOTNET_BUILD_ARGS: ""

jobs:
  build:
    parameters:
      os:
        type: executor
    executor: << parameters.os >>
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - checkout
      - setup-dotnet:
          with:
            dotnet-version: |
              10.0.x
              11.0.x
      - run:
          name: Run build script
          # net481 tests only run on Windows; DOTNET_BUILD_ARGS carries the per-OS args.
          command: cd scripts && bash ./dotnet_build.sh ${DOTNET_BUILD_ARGS:-}

workflows:
  main-build:
    jobs:
      - build:
          matrix:
            parameters:
              os: [linux-x64, linux-arm, macos, windows]
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
